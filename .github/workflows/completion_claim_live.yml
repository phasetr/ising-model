name: Completion Claim Live

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Positive decimal pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: >-
    completion-claim-live-${{ github.repository }}-${{
    github.event.pull_request.number || inputs.pr_number || 'main-backfill' }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Evaluate bounded live completion claim
        run: python3 scripts/completion_claim_live.py
