name: Handwritten Pages

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the freshly built and checked artifact
        required: true
        type: boolean
        default: false
      source_sha:
        description: Exact commit on main to publish
        required: true
        type: string
      source_ref:
        description: Ref expected to resolve to source_sha
        required: true
        type: string
        default: main
  workflow_call:
    inputs:
      deploy:
        required: true
        type: boolean
      source_sha:
        required: true
        type: string
      source_ref:
        required: true
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check handwritten snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      generated-at: ${{ steps.metadata.outputs.generated-at }}
    steps:
      - name: Checkout exact publication source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify source identity and main ancestry
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if git rev-parse --verify --quiet "$SOURCE_REF^{commit}" > /dev/null; then
            resolved_ref=$(git rev-parse "$SOURCE_REF^{commit}")
          else
            resolved_ref=$(git rev-parse "origin/$SOURCE_REF^{commit}")
          fi
          test "$resolved_ref" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify configured base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: test "$BASE_PATH" = "/ising-model"
      - name: Build with the supported GitHub Pages Jekyll stack
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
          build_revision: ${{ inputs.source_sha }}
      - name: Record generation time
        id: metadata
        run: echo "generated-at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Stamp, inventory, and crawl the handwritten artifact
        env:
          GENERATED_AT: ${{ steps.metadata.outputs.generated-at }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python3 scripts/pages_site_check.py prepare
          --site ./_site --source ./docs --baseurl /ising-model
          --revision "$SOURCE_SHA" --generated-at "$GENERATED_AT"
      - name: Upload the one complete Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site
          retention-days: 1

  deploy:
    name: Deploy and verify handwritten snapshot
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Checkout the verifier at the published revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify the live snapshot and exact provenance
        env:
          GENERATED_AT: ${{ needs.build.outputs.generated-at }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python3 scripts/pages_site_check.py live
          --url "$PAGE_URL" --source ./docs --baseurl /ising-model
          --revision "$SOURCE_SHA" --generated-at "$GENERATED_AT"
